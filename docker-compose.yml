services:
  volume-permissions:
    build: .
    user: "0:0"
    command: ["python", "-m", "app.volume_permissions"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./data:/data
      - ./appdata:/appdata
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    restart: "no"

  bridge:
    build: .
    container_name: wahoo-garmin-fit-bridge
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      WEB_PORT:
      TZ:
      APP_NAME:
      POLL_SECONDS:
      MAX_RETRIES:
      LOG_LEVEL:
      WEB_AUTH_ENABLED:
      WEB_USERNAME:
      WEB_PASSWORD:
      WEB_PASSWORD_HASH:
      SESSION_SECRET_KEY:
      SESSION_COOKIE_NAME:
      SESSION_COOKIE_SECURE:
      SESSION_MAX_AGE_SECONDS:
      LOGIN_RATE_LIMIT_ATTEMPTS:
      LOGIN_RATE_LIMIT_WINDOW_SECONDS:
      DROPBOX_SOURCE_ENABLED:
      IGPSPORT_SOURCE_ENABLED:
      DROPBOX_POLL_SECONDS:
      IGPSPORT_POLL_SECONDS:
      IGPSPORT_MIN_POLL_SECONDS:
      IGPSPORT_MAX_PAGES_PER_POLL:
      RCLONE_REMOTE:
      DROPBOX_WAHOO_PATH:
      RCLONE_POLL_SECONDS:
      RCLONE_CONFIG_PATH:
      IGPSPORT_BASE_URL:
      IGPSPORT_CONFIG_DIR:
      IGPSPORT_IMPORT_MODE:
      FIT_INCOMING_DIR:
      FIT_PROCESSING_DIR:
      FIT_UPLOADED_DIR:
      FIT_DUPLICATE_DIR:
      FIT_FAILED_DIR:
      FIT_ARCHIVE_DIR:
      SQLITE_PATH:
      LOG_DIR:
      RUNTIME_CONFIG_PATH:
      REAL_FIT_DIR:
      REAL_FIT_UPLOAD_DIR:
      MAX_REAL_FIT_UPLOAD_BYTES:
      DETECTED_DEVICES_PATH:
      GARMIN_CONFIG_DIR:
      GARMIN_PROFILE_NAME:
      GARMIN_DEVICE_NAME:
      GARMIN_UNIT_ID:
      DRY_RUN:
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    volumes:
      - ./data:/data
      - ./appdata:/appdata
      - ./real_fit:/real_fit:ro
    ports:
      - "${WEB_PORT:-8088}:8080"
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
